# Brand classification seeds.
#
# These drive the *auto-suggestion* when a brand is first seen in scraped data. The suggestion is
# written to data/brands.csv with confirmed=false; you confirm/correct it in the dashboard's
# "Brand Review" page, and confirmed rows are never re-suggested.
#
# Matching is on a normalised key (lowercase, punctuation/whitespace stripped), so "Dr. Jart+"
# and "Dr Jart" both hit. Anything not listed here is suggested as "Unclassified".

