# Delivery locations to crawl — 3-4 per metro, mixing dense residential and commercial areas.
#
# search_text is typed into Blinkit's "search delivery location" box and the first suggestion
# is selected, so keep it something Google-Places-like ("<area>, <city> <pincode>").
# The scraper records the lat/lon/locality Blinkit actually resolved, so you can verify each one
# in the "Crawl health" section of the dashboard and tweak search_text if a pincode lands wrong.
#
# Set enabled: false to skip a location without deleting it. Add new ones anytime.

pincodes:
